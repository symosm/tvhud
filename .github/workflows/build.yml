name: Build TV Hud APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TVHud.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVHud-apk
          path: TVHud.apk

      - name: Publish as the "latest" release (easy download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TVHud.apk \
            --title "TV Hud (latest build)" \
            --notes "Download TVHud.apk and install it on your TV. Built from commit ${GITHUB_SHA::7}."
